# CinematoMusicPlayer Configuration

# Web server settings
web-server:
  enabled: true
  port: 9090

# Music settings
music:
  # Show bossbar by default
  default-bossbar-enabled: true

# Web access protection
security:
  # Set with /musicplayer password <password>.
  # If blank on first startup, a strong password is generated automatically.
  admin-password: ""
